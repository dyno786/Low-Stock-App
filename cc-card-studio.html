<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--blue:#1F44A5;--red:#C62828;--panel:#14151a;--panel2:#1d1f27;--line:#2c2f3a;--ink:#e9eaee;--muted:#9aa0ad}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#0b0c0f;color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;max-height:100vh}
.side .top{padding:14px;border-bottom:1px solid var(--line)}
.lr{display:flex;align-items:center;gap:10px;margin-bottom:12px}.lr img{height:38px}
.lr b{font-size:13.5px;line-height:1.1}.lr span{display:block;font-size:10.5px;color:var(--muted)}
.search,select,input[type=text],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:12.5px;padding:9px 10px;border-radius:8px;resize:vertical}
.search:focus,select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue)}
.count{font-size:10.5px;color:var(--muted);margin-top:8px}
.list{overflow-y:auto;padding:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--panel2)}.item.on{background:#232636;outline:1px solid var(--blue)}
.item img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#fff;flex:0 0 auto}
.item .n{font-size:12px;line-height:1.25;max-height:2.5em;overflow:hidden}
.item .p{font-size:11px;color:var(--muted);margin-top:2px}.oos{color:#c9885f}
.main{display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}
.preview{display:flex;flex-direction:column;align-items:center;padding:20px;overflow:auto;background:radial-gradient(900px 500px at 50% -10%,#1a1c22,#0b0c0f)}
.bar{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;gap:5px;background:var(--panel2);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:7px 15px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.frame{border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);flex:0 0 auto;position:relative}
.scaler{transform-origin:top left}
.es{color:var(--muted);text-align:center;margin-top:100px;font-size:13.5px;max-width:280px}
.es b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
.pv{display:flex;gap:10px;margin-top:16px}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;padding:11px 18px;border-radius:10px}
.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#2854c8}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:wait}
.editor{background:var(--panel);border-left:1px solid var(--line);padding:18px 18px 40px;overflow-y:auto;max-height:100vh}
.editor h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 4px}
.sub{font-size:11px;color:var(--muted);margin:0 0 12px}
label{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:13px 0 5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.file{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px dashed var(--line);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--muted);cursor:pointer}
.file:hover{border-color:var(--blue);color:var(--ink)}.file input{display:none}.file .clr{color:#ff8080;font-weight:600}
.capbox{position:relative}
.copybtn{position:absolute;top:6px;right:6px;font-size:11px;padding:5px 10px;border-radius:7px;border:0;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.copybtn.done{background:#2e7d32}
.warn{background:#3a2a12;border:1px solid #6b4a1e;color:#e7b877;font-size:11.5px;padding:8px 10px;border-radius:8px;margin-top:12px}

/* ============ CARD (canvas). --cw/--ch set per size ============ */
.card{width:var(--cw);height:var(--ch);position:relative;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff}
.card .bg{position:absolute;inset:0;background:linear-gradient(150deg,var(--g1),var(--g2) 42%,var(--g3) 78%,var(--g4))}
.card .photo{position:absolute;inset:0;background-size:cover;background-position:center;mix-blend-mode:overlay;opacity:.95}
.card .photo.plain{mix-blend-mode:normal;opacity:1}
.card .tint{position:absolute;inset:0;background:linear-gradient(150deg,rgba(247,150,60,.20),rgba(176,19,102,.32))}
.card .vig{position:absolute;inset:0;background:linear-gradient(to top,rgba(110,8,64,.62),transparent 45%)}
.mark{position:absolute;filter:drop-shadow(0 3px 10px rgba(0,0,0,.45)) drop-shadow(0 0 22px rgba(255,255,255,.3))}
.eyebrow{position:absolute;background:var(--red);font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:2px;text-transform:uppercase;border-radius:6px}
.pname{position:absolute;font-weight:800;line-height:1.06;text-shadow:0 3px 16px rgba(90,0,50,.4)}
.rule{position:absolute;height:6px;background:#fff;border-radius:3px}
.bullets{position:absolute;display:flex;flex-direction:column}
.bl{display:flex;align-items:flex-start}
.chk{flex:0 0 auto;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(198,40,40,.45)}
.bl p{margin:0;font-weight:500}
.pimg{position:absolute;object-fit:contain;filter:drop-shadow(0 22px 38px rgba(70,0,40,.5))}
.price{position:absolute;border-radius:50%;background:var(--red);border:5px solid #fff;box-shadow:0 12px 30px rgba(120,0,50,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg)}
.price .l{font-family:'Oswald',sans-serif;letter-spacing:2px;opacity:.9}
.price .v{font-weight:800;line-height:.95}
.cta{position:absolute;background:var(--blue);font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border-radius:12px;box-shadow:0 10px 26px rgba(31,68,165,.45)}
.foot{position:absolute;left:0;right:0;text-align:center;font-weight:600;letter-spacing:1px}
.cc{position:absolute}
.cc .head{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;line-height:.98;text-shadow:0 4px 20px rgba(80,0,45,.5)}
.cc .sb{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;text-shadow:0 2px 12px rgba(80,0,45,.5)}
.swipe{position:absolute;display:flex;align-items:center;gap:10px;font-family:'Oswald',sans-serif;letter-spacing:2px;text-transform:uppercase}
.cph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);text-align:center;padding:0 120px}

/* ---- SQUARE 1080x1080 ---- */
.sq .mark{top:44px;left:50px;height:112px}.sq .mark.right{left:auto;right:50px}
.sq .eyebrow{top:250px;left:60px;font-size:24px;padding:8px 18px}
.sq .pname{top:312px;left:60px;width:560px;font-size:52px}
.sq .rule{left:62px;width:120px}
.sq .bullets{left:60px;width:540px;gap:22px}
.sq .chk{width:40px;height:40px;margin-top:1px}.sq .chk svg{width:20px;height:20px}
.sq .bl{gap:16px}.sq .bl p{font-size:26px;line-height:1.25}
.sq .pimg{right:26px;bottom:140px;width:440px;height:640px;object-position:bottom right}
.sq .price{top:250px;right:60px;width:186px;height:186px}.sq .price .l{font-size:19px}.sq .price .v{font-size:48px}
.sq .cta{bottom:118px;left:60px;font-size:30px;padding:16px 34px}
.sq .foot{bottom:46px;font-size:24px}
.sq .cc{left:62px;right:62px;bottom:150px}.sq .cc .head{font-size:78px}.sq .cc .sb{font-size:31px;margin-top:18px}
.sq .swipe{right:52px;bottom:44px;font-size:23px}.sq .swipe svg{width:36px;height:36px}
.sq .cph{font-size:26px}

/* ---- STORY 1080x1920 (tall) ---- */
.st .mark{top:80px;left:60px;height:130px}.st .mark.right{left:auto;right:60px}
.st .eyebrow{top:470px;left:70px;font-size:30px;padding:10px 22px}
.st .pname{top:548px;left:70px;width:760px;font-size:66px}
.st .rule{left:72px;width:150px;height:7px}
.st .bullets{left:70px;width:760px;gap:30px}
.st .chk{width:50px;height:50px;margin-top:2px}.st .chk svg{width:26px;height:26px}
.st .bl{gap:20px}.st .bl p{font-size:34px;line-height:1.28}
.st .pimg{left:50%;transform:translateX(-50%);bottom:300px;width:620px;height:760px;object-position:bottom center}
.st .price{top:1120px;right:90px;width:230px;height:230px}.st .price .l{font-size:24px}.st .price .v{font-size:62px}
.st .cta{bottom:230px;left:50%;transform:translateX(-50%);font-size:40px;padding:22px 60px}
.st .foot{bottom:120px;font-size:32px}
.st .cc{left:80px;right:80px;bottom:360px}.st .cc .head{font-size:104px}.st .cc .sb{font-size:40px;margin-top:26px}
.st .swipe{left:0;right:0;bottom:70px;justify-content:center;font-size:30px}.st .swipe svg{width:44px;height:44px}
.st .cph{font-size:34px;padding:0 160px}
/* story product photo sits behind text lower down; keep bullets clear of it via layout above */
.st.hasprod .bullets{width:620px}

@media(max-width:1000px){.app{grid-template-columns:1fr}.side{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}
.main{grid-template-columns:1fr}.editor{border-left:0;border-top:1px solid var(--line)}}

function removeWhite(im){
 const sc=Math.min(1,900/Math.max(im.naturalWidth,im.naturalHeight));
 const w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const cx=cv.getContext('2d');cx.drawImage(im,0,0,w,h);
 let d;try{d=cx.getImageData(0,0,w,h)}catch(e){return null}
 const px=d.data,N=w*h,vis=new Uint8Array(N),st=[];
 const white=i=>{const o=i*4;return px[o]>236&&px[o+1]>236&&px[o+2]>236&&px[o+3]>8};
 const seed=(x,y)=>{const i=y*w+x;if(!vis[i]&&white(i)){vis[i]=1;st.push(i)}};
 for(let x=0;x<w;x++){seed(x,0);seed(x,h-1)}for(let y=0;y<h;y++){seed(0,y);seed(w-1,y)}
 while(st.length){const i=st.pop(),x=i%w,y=(i/w)|0;px[i*4+3]=0;
  if(x+1<w)seed(x+1,y);if(x-1>=0)seed(x-1,y);if(y+1<h)seed(x,y+1);if(y-1>=0)seed(x,y-1);}
 const a=new Uint8ClampedArray(N);for(let i=0;i<N;i++)a[i]=px[i*4+3];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(a[i]>0){let e=false;
  if(x+1<w&&a[i+1]===0)e=true;if(x-1>=0&&a[i-1]===0)e=true;if(y+1<h&&a[i+w]===0)e=true;if(y-1>=0&&a[i-w]===0)e=true;
  if(e)px[i*4+3]=Math.min(px[i*4+3],200);}}
 cx.putImageData(d,0,0);
 let mnx=w,mny=h,mxx=0,mxy=0,any=false;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(px[(y*w+x)*4+3]>12){any=true;if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;}}
 if(!any)return null;const pad=6;mnx=Math.max(0,mnx-pad);mny=Math.max(0,mny-pad);mxx=Math.min(w-1,mxx+pad);mxy=Math.min(h-1,mxy+pad);
 const cw=mxx-mnx+1,ch=mxy-mny+1,o=document.createElement('canvas');o.width=cw;o.height=ch;
 o.getContext('2d').drawImage(cv,mnx,mny,cw,ch,0,0,cw,ch);return o.toDataURL('image/png');
}

 [...$('list').children].forEach(e=>e.onclick=()=>sel(+e.dataset.i));}
function sel(i){const p=C[i];if(!p)return;cur=p;
 $('f-ey').value=p.v.toUpperCase();$('f-pn').value=p.t;$('f-pr').value='£'+(+p.p).toFixed(2);
 $('f-ct').value='Shop Now';$('f-bu').value=p.b.join('\n');$('f-cap').value=cap(p);
 $('f-hd').value=head(p);$('f-sb').value='New in at CC Hair & Beauty · £'+(+p.p).toFixed(2);
 $('ow').style.display=p.n<=0?'block':'none';$('ipn').textContent='Replace photo (auto-cuts white bg)';$('ipc').style.display='none';
 $('frame').style.display='';$('pv').style.display='flex';$('es').style.display='none';$('eb').style.display='block';$('eh').style.display='none';
 prodImg=null;$('vpi').removeAttribute('src');setProductPhoto(imgurl(p)+'&width=800',true);draw();list($('q').value);}
function draw(){const g=G[$('f-gr').value]||G.sunset,c=$('card');
 c.style.setProperty('--g1',g[0]);c.style.setProperty('--g2',g[1]);c.style.setProperty('--g3',g[2]);c.style.setProperty('--g4',g[3]);
 $('pb').style.display=mode==='product'?'':'none';$('cb').style.display=mode==='cover'?'':'none';
 $('vmark').classList.toggle('right',mode==='cover');
 c.classList.toggle('hasprod',mode==='product');
 const ph=$('vph');
 if(mode==='cover'&&photo){ph.style.backgroundImage="url('"+photo+"')";ph.className='photo'+($('f-bd').value==='plain'?' plain':'');$('vcph').style.display='none'}
 else{ph.style.backgroundImage='none';ph.className='photo';$('vcph').style.display=mode==='cover'?'flex':'none'}
 if(mode==='product'){$('vey').textContent=$('f-ey').value||' ';$('vpn').textContent=$('f-pn').value;
  $('vpr').textContent=$('f-pr').value;$('vct').innerHTML=esc($('f-ct').value||'Shop Now')+' <span style="font-family:Poppins">→</span>';
  const L=$('f-bu').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);
  const k='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  $('vbu').innerHTML=L.map(t=>'<div class="bl"><div class="chk">'+k+'</div><p>'+esc(t)+'</p></div>').join('');
  const nameTop=(size==='st'?548:312),gap1=(size==='st'?26:22),gap2=(size==='st'?62:52);
  const nb=nameTop+$('vpn').offsetHeight;$('vru').style.top=(nb+gap1)+'px';$('vbu').style.top=(nb+gap2)+'px';
 }else{$('vhd').innerHTML=esc($('f-hd').value).replace(/\n/g,'<br>');$('vsb').innerHTML=esc($('f-sb').value).replace(/\n/g,'<br>');}}
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;
 [...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.grp').forEach(g=>g.style.display=g.dataset.f===mode?'':'none');
 $('et').textContent=mode==='product'?'Post details':'Slide details';draw()};
$('sizeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;size=b.dataset.s;
 [...$('sizeSeg').children].forEach(x=>x.classList.toggle('on',x===b));applySize();draw()};
['f-ey','f-pn','f-pr','f-ct','f-bu','f-gr','f-hd','f-sb','f-bd'].forEach(i=>{$(i).oninput=draw;$(i).onchange=draw});
$('phf').onchange=()=>{const f=$('phf').files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{photo=r.result;$('phn').textContent=f.name.slice(0,20);$('phc').style.display='inline';draw()};r.readAsDataURL(f)};
$('phc').onclick=e=>{e.preventDefault();e.stopPropagation();photo=null;$('phf').value='';$('phn').textContent='Upload photo';$('phc').style.display='none';draw()};
$('ipf').onchange=()=>{const f=$('ipf').files[0];if(!f)return;const r=new FileReader();
 r.onload=async()=>{$('ipn').textContent=f.name.slice(0,20);$('ipc').style.display='inline';await setProductPhoto(r.result,false);};r.readAsDataURL(f)};
$('ipc').onclick=e=>{e.preventDefault();e.stopPropagation();$('ipf').value='';if(cur){$('ipn').textContent='Replace photo (auto-cuts white bg)';$('ipc').style.display='none';setProductPhoto(imgurl(cur)+'&width=800',true);}};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('f-cap').value);const b=$('cp');
 b.textContent='Copied ✓';b.classList.add('done');setTimeout(()=>{b.textContent='Copy';b.classList.remove('done')},1600)}
 catch(e){$('f-cap').select();document.execCommand('copy')}};
async function fontsReady(){try{await Promise.all([document.fonts.load('700 78px "Oswald"'),document.fonts.load('600 30px "Oswald"'),
 document.fonts.load('800 52px "Poppins"'),document.fonts.load('500 26px "Poppins"')]);}catch(e){}await document.fonts.ready;}
async function cv(){await fontsReady();const s=SIZES[size];const clone=$('card').cloneNode(true);
 clone.style.transform='none';clone.style.margin='0';
 const box=document.createElement('div');box.style.cssText='position:fixed;left:-14000px;top:0;width:'+s.w+'px;height:'+s.h+'px;overflow:hidden;background:transparent';
 box.appendChild(clone);document.body.appendChild(box);
 try{return await html2canvas(clone,{width:s.w,height:s.h,scale:2,backgroundColor:null,useCORS:true,imageTimeout:20000,windowWidth:s.w,windowHeight:s.h});}
 finally{document.body.removeChild(box);}}
$('dl').onclick=async()=>{const b=$('dl');b.disabled=true;b.textContent='Rendering…';
 try{const c=await cv();const a=document.createElement('a');
 a.download=cur.t.replace(/[^a-z0-9]+/gi,'-').toLowerCase().slice(0,36)+'-'+mode+'-'+size+'.png';a.href=c.toDataURL('image/png');a.click()}
 catch(e){alert('Export snag: '+e.message+'. Try "Open image".')}b.disabled=false;b.textContent='Download PNG'};
$('op').onclick=async()=>{const b=$('op');b.disabled=true;b.textContent='Rendering…';
 try{const c=await cv();const w=window.open('');w.document.write('<img src="'+c.toDataURL('image/png')+'" style="max-width:100%">')}
 catch(e){alert('Could not render: '+e.message)}b.disabled=false;b.textContent='Open image'};
$('q').oninput=e=>list(e.target.value);
applySize();list('');
